name: 12-Hour SSH Proxy for Injector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install SSH and Tinyproxy
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server tinyproxy

      - name: Configure SSH (With Password)
        run: |
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          sudo useradd -m labuser || true
          
          # Set a password for easy login in HTTP Injector
          echo "labuser:password123" | sudo chpasswd
          
          # Enable password authentication
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Configure Tinyproxy (Port 80 to 22)
        run: |
          # Make proxy listen on port 80
          sudo sed -i 's/^Port 8888/Port 80/' /etc/tinyproxy/tinyproxy.conf
          # Allow outside connections
          sudo sed -i 's/^#Allow 127.0.0.1/Allow 0.0.0.0\/0/' /etc/tinyproxy/tinyproxy.conf
          sudo sed -i 's/^Allow 127.0.0.1/Allow 0.0.0.0\/0/' /etc/tinyproxy/tinyproxy.conf
          # CRITICAL: Allow the proxy to forward connections to SSH port 22
          echo "ConnectPort 22" | sudo tee -a /etc/tinyproxy/tinyproxy.conf
          
          sudo systemctl restart tinyproxy

      - name: Get Tailscale IP
        run: |
          echo "=================================================="
          echo "COPY THIS TAILSCALE IP:"
          tailscale ip -4
          echo "=================================================="

      - name: Keep lab running
        run: |
          sleep 21000
