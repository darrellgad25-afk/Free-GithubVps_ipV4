name: school work time

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Set to 5h 50m to trigger before the 6h limit

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install SSH and Tinyproxy
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server tinyproxy

      - name: Configure SSH (Private Key Auth)
        run: |
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          sudo useradd -m -s /bin/bash labuser || true
          
          sudo mkdir -p /home/labuser/.ssh
          echo "ssh-rsa  u0_a559@localhost" | sudo tee /home/labuser/.ssh/authorized_keys
          
          sudo chown -R labuser:labuser /home/labuser/.ssh
          sudo chmod 700 /home/labuser/.ssh
          sudo chmod 600 /home/labuser/.ssh/authorized_keys
          
          sudo sed -i 's/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Configure Tinyproxy (Port 80 -> 22)
        run: |
          sudo sed -i 's/^Port 8888/Port 80/' /etc/tinyproxy/tinyproxy.conf
          sudo sed -i 's/^Allow 127.0.0.1/Allow 0.0.0.0\/0/' /etc/tinyproxy/tinyproxy.conf
          echo "ConnectPort 22" | sudo tee -a /etc/tinyproxy/tinyproxy.conf
          sudo systemctl restart tinyproxy

      - name: Get Tailscale IP
        run: |
          echo "=================================================="
          echo "COPY THIS SERVER IP:"
          tailscale ip -4
          echo "=================================================="

      - name: Auto-Renew Workflow
        run: |
          echo "Renewing workflow in 5h 50m..."
          sleep 21000
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/school-work-time.yml/dispatches \
            -d '{"ref":"main"}'
