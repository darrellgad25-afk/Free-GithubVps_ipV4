
name: Tailscale SNI Test Server

on:
  workflow_dispatch:

jobs:
  sni-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl python3

      - name: Create TLS test certificate
        run: |
          openssl req -x509 -newkey rsa:2048 \
            -keyout server.key \
            -out server.crt \
            -days 2 -nodes \
            -subj "/CN=sni-test.local"

      - name: Create SNI inspection server
        run: |
          cat > sni_server.py <<'PY'
          import ssl
          import sys
          from http.server import HTTPServer, BaseHTTPRequestHandler
          from socketserver import ThreadingMixIn

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"SNI test server is working!")

              def log_message(self, fmt, *args):
                  print("HTTP:", fmt % args, flush=True)

          class ThreadedServer(ThreadingMixIn, HTTPServer):
              daemon_threads = True

          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain("server.crt", "server.key")

          def inspect_sni(sock, server_name, context):
              print("RECEIVED SNI:", server_name, flush=True)

          context.set_servername_callback(inspect_sni)

          host = sys.argv[1]
          server = ThreadedServer((host, 8443), Handler)
          server.socket = context.wrap_socket(
              server.socket, server_side=True
          )

          print("SNI server listening on", host, "port 8443", flush=True)
          server.serve_forever()
          PY

      - name: Start SNI server
        run: |
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "SNI TEST SERVER IP: $TS_IP"
          nohup python3 -u sni_server.py "$TS_IP" > sni.log 2>&1 &
          sleep 2
          cat sni.log

      - name: Keep server running and show SNI logs
        run: |
          tail -f sni.log
